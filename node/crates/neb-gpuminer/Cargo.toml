[package]
name = "neb-gpuminer"
description = "GPU miner of the NEB work service: share attempts on CUDA devices, checked on the CPU before they are sent."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Builds pow/gpu with nvcc (CUDA toolkit and, on Windows, the MSVC build tools) and the neb-miner-gpu binary.
cuda = []
metal = ["dep:metal", "dep:objc", "dep:neb-sky"]
metal-bench = ["metal"]

[[bin]]
name = "neb-miner-metal"
path = "src/metal_main.rs"
required-features = ["metal"]

[target.'cfg(target_os = "macos")'.dependencies]
neb-sky = { path = "../neb-sky", optional = true }
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }

[[bin]]
name = "neb-miner-gpu"
path = "src/main.rs"
required-features = ["cuda"]

[[example]]
name = "metal_starts"
required-features = ["metal"]

[[example]]
name = "metal_turnover"
required-features = ["metal-bench"]

[[example]]
name = "metal_selected"
required-features = ["metal-bench"]

[[example]]
name = "metal_factorial"
required-features = ["metal-bench"]

[[example]]
name = "metal_refresh"
required-features = ["metal"]

[[example]]
name = "bench_gpu"
required-features = ["cuda"]

[dependencies]
neb-block = { path = "../neb-block" }
neb-cpuminer = { path = "../neb-cpuminer" }
neb-engines = { path = "../neb-engines" }
neb-pow = { path = "../neb-pow" }
blake3 = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
neb-wallet = { path = "../neb-wallet" }
neb-chain = { path = "../neb-chain" }
neb-node = { path = "../neb-node" }

[lints]
workspace = true
